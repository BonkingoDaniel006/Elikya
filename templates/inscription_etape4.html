<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription (4/4) - Elikya</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='auth_style.css') }}">
</head>
<body>

    <div class="auth-container">
        <h1>Sécurisez votre compte</h1>

        <!-- Barre de progression -->
        <div class="progress-bar">
            <div class="progress-line" style="width: 100%;"></div>
            <div class="progress-step active">1</div>
            <div class="progress-step active">2</div>
            <div class="progress-step active">3</div>
            <div class="progress-step active">4</div>
        </div>

        <!-- Affichage des messages flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('auth.inscription') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirmer le mot de passe</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
            <button type="submit" class="btn">Terminer l'inscription</button>
        </form>
    </div>

</body>
</html>
