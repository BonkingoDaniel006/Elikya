<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initiation de Paiement Shwary</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 0.75rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background-color: #0056b3; }
        #error-message { color: red; margin-top: 1rem; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Paiement Shwary</h1>
    <form id="payment-form">
        <!-- 1. Rendre le token CSRF disponible pour le script -->
        <input type="hidden" id="csrf_token" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="phone">Numéro de téléphone (ex: +243...)</label>
            <input type="tel" id="phone" name="phone" required>
        </div>
        <div class="form-group">
            <label for="amount">Montant (CDF)</label>
            <input type="number" id="amount" name="amount" required>
        </div>
        <button type="submit">Payer</button>
    </form>
    <p id="error-message"></p>
</div>

<script>
    document.getElementById('payment-form').addEventListener('submit', async function(event) {
        event.preventDefault();
        const phone = document.getElementById('phone').value;
        const amount = document.getElementById('amount').value;
        const errorMessage = document.getElementById('error-message');
        // 2. Lire le token depuis le champ caché
        const csrfToken = document.getElementById('csrf_token').value;
        errorMessage.textContent = '';

        try {
            const response = await fetch('/api/payment/initiate', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    // 3. Ajouter le token à l'en-tête de la requête
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({ phone: phone, amount: parseFloat(amount), country: 'DRC' })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Une erreur est survenue.');
            }

            window.location.href = `/attente?tid=${data.transaction_id}`;
        } catch (error) {
            errorMessage.textContent = `Erreur: ${error.message}`;
        }
    });
</script>

</body>
</html>
