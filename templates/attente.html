<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>En attente du paiement</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .loader { border: 8px solid #f3f3f3; border-top: 8px solid #3498db; border-radius: 50%; width: 60px; height: 60px; animation: spin 2s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div>
    <h1>Veuillez valider le paiement sur votre téléphone</h1>
    <p>Nous attendons la confirmation de la transaction...</p>
    <div class="loader"></div>
    <p id="status-message"></p>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const transactionId = params.get('tid');

    if (!transactionId) {
        document.body.innerHTML = '<h1>Erreur: ID de transaction manquant.</h1>';
    } else {
        const pollStatus = async () => {
            try {
                const response = await fetch(`/api/transactions/${transactionId}`);
                const data = await response.json();

                if (data.status === 'completed' || data.status === 'failed') {
                    clearInterval(pollingInterval);
                    window.location.href = `/resultat?status=${data.status}&tid=${transactionId}`;
                }
            } catch (error) {
                console.error("Erreur lors de la vérification du statut:", error);
                document.getElementById('status-message').textContent = "Erreur de communication avec le serveur.";
            }
        };

        const pollingInterval = setInterval(pollStatus, 3000); // Vérifie toutes les 3 secondes
    }
</script>

</body>
</html>
